name: Build Release
run-name: Build Release by ${{ github.actor }}
on: 
  release:
    types: [ published ]
  push:
    branches: [ main ] 
  pull_request:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Names the build outputs: the tag for releases, the branch for pushes.
  # A pull request's ref name ("1/merge") isn't a file name, so use "pr-1".
  BUILD_NAME: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
jobs:
  build-linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, profile: x64 }
          - { arch: aarch64, profile: arm64 }
          - { arch: armhf, profile: armv7l }
          - { arch: i686, profile: x86 }
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
        
      - name: build binary and appimage
        uses: addnab/docker-run-action@v3
        with:
          image: wyzdwdz/assfonts-amd64:latest
          options: -v ${{ github.workspace }}:/var/www
          shell: bash
          run: |
            source ~/.bashrc
            set -e
            cd /var/www
            cp ./.github/linux/CMakeUserPresets.json .
            cmake . --preset linux-${{ matrix.profile }}
            cmake --build --preset linux-${{ matrix.profile }}-release --target install -j
            mv ./out/install/linux-${{ matrix.profile }}/bin/assfonts-cli assfonts-cli-${{ env.BUILD_NAME }}-${{ matrix.arch }}-Linux
            cp ./.github/linux/AppImageBuilder_${{ matrix.profile }}.yml AppImageBuilder.yml
            mkdir -p ./AppDir/usr
            cp -r ./out/install/linux-${{ matrix.profile }}/* ./AppDir/usr
            mkdir -p ./AppDir/usr/share/icons
            cp ./src/qt/resources/icon.png ./AppDir/usr/share/icons
            mkdir -p ./AppDir/usr/share/applications
            cp ./src/qt/resources/assfonts.desktop ./AppDir/usr/share/applications
            sed -i 's/!!!VERSION!!!/${{ env.BUILD_NAME }}/g' AppImageBuilder.yml
            appimage-builder --recipe AppImageBuilder.yml --skip-tests

      - name: upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: release-Linux-${{ matrix.arch }}
          path: assfonts*-${{ env.BUILD_NAME }}-${{ matrix.arch }}-Linux*
          if-no-files-found: error
          
      - name: upload issue
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.profile }}-issue
          path: out/build/linux-${{ matrix.profile }}/vcpkg_installed/vcpkg/issue_body.md

      - name: show failed dependency logs
        if: failure()
        shell: bash
        run: |
          # vcpkg keeps each dependency's build output under buildtrees; the
          # newest logs belong to the dependency that failed.
          logs=$(find vcpkg/buildtrees -maxdepth 2 -name '*.log' -size +0 2>/dev/null)
          [ -z "$logs" ] && exit 0
          ls -t $logs | head -n 6 | while read -r f; do
            echo "::group::$f"; tail -n 120 "$f"; echo "::endgroup::"
          done

      - name: upload dependency build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.profile }}-vcpkg-logs
          path: vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore

  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: powershell
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, profile: x64 }
          - { arch: aarch64, profile: arm64 }
          - { arch: i686, profile: x86 }
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: install cmake
        uses: lukka/get-cmake@latest
        
      - name: setup msvc x86_64
        uses: TheMrMilchmann/setup-msvc-dev@v3
        if: ${{ matrix.arch == 'x86_64' }}
        with:
          arch: x64
          
      - name: setup msvc aarch64
        uses: TheMrMilchmann/setup-msvc-dev@v3
        if: ${{ matrix.arch == 'aarch64' }}
        with:
          arch: amd64_arm64

      - name: setup msvc i686
        uses: TheMrMilchmann/setup-msvc-dev@v3
        if: ${{ matrix.arch == 'i686' }}
        with:
          arch: amd64_x86

      - name: build executable binary
        run: |
          Copy-Item -Path ".\.github\windows\CMakeUserPresets.json" -Destination "CMakeUserPresets.json" -Force
          cmake . --preset windows-${{ matrix.profile }}
          cmake --build --preset windows-${{ matrix.profile }}-release --target install -j

      - name: copy and rename
        run: |
           Copy-Item -Path ".\out\install\windows-${{ matrix.profile }}\bin\assfonts-cli.exe" -Destination "assfonts-cli-${{ env.BUILD_NAME }}-${{ matrix.arch }}-Windows.exe" -Force
           Copy-Item -Path ".\out\install\windows-${{ matrix.profile }}\bin\assfonts.exe" -Destination "assfonts-${{ env.BUILD_NAME }}-${{ matrix.arch }}-Windows.exe" -Force

      - name: upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: release-Windows-${{ matrix.arch }}
          path: assfonts*-${{ env.BUILD_NAME }}-${{ matrix.arch }}-Windows*
          if-no-files-found: error
          
      - name: upload issue
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.profile }}-issue
          path: out/build/windows-${{ matrix.profile }}/vcpkg_installed/vcpkg/issue_body.md

      - name: show failed dependency logs
        if: failure()
        shell: bash
        run: |
          # vcpkg keeps each dependency's build output under buildtrees; the
          # newest logs belong to the dependency that failed.
          logs=$(find vcpkg/buildtrees -maxdepth 2 -name '*.log' -size +0 2>/dev/null)
          [ -z "$logs" ] && exit 0
          ls -t $logs | head -n 6 | while read -r f; do
            echo "::group::$f"; tail -n 120 "$f"; echo "::endgroup::"
          done

      - name: upload dependency build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.profile }}-vcpkg-logs
          path: vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore
          
  build-macos:
    # Intel builds on an Intel runner, Apple Silicon natively on an M-series one.
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, profile: x64, runner: macos-15-intel }
          - { arch: aarch64, profile: arm64, runner: macos-15 }
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: install cmake
        uses: lukka/get-cmake@latest

      - name: install autotools
        run: |
          brew install autoconf autoconf-archive automake libtool
          # Homebrew installs libtoolize as glibtoolize; vcpkg looks for libtoolize.
          echo "$(brew --prefix libtool)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: build executable binary
        run: |
          cp .github/macos/CMakeUserPresets.json .
          cmake . --preset macos-${{ matrix.profile }}
          cmake --build --preset macos-${{ matrix.profile }}-release --target package -j

      - name: rename
        run: |
          mv -f assfonts.dmg assfonts-${{ env.BUILD_NAME }}-${{ matrix.arch }}-macOS.dmg

      - name: upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: release-macOS-${{ matrix.arch }}
          path: assfonts-${{ env.BUILD_NAME }}-${{ matrix.arch }}-macOS.dmg
          if-no-files-found: error
          
      - name: upload issue
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.profile }}-issue
          path: out/build/macos-${{ matrix.profile }}/vcpkg_installed/vcpkg/issue_body.md

      - name: show failed dependency logs
        if: failure()
        shell: bash
        run: |
          # vcpkg keeps each dependency's build output under buildtrees; the
          # newest logs belong to the dependency that failed.
          logs=$(find vcpkg/buildtrees -maxdepth 2 -name '*.log' -size +0 2>/dev/null)
          [ -z "$logs" ] && exit 0
          ls -t $logs | head -n 6 | while read -r f; do
            echo "::group::$f"; tail -n 120 "$f"; echo "::endgroup::"
          done

      - name: upload dependency build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.profile }}-vcpkg-logs
          path: vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore
          
  release:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    needs: [ build-linux, build-windows, build-macos ]
    if: github.event_name == 'release'
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: download Linux x86_64
        uses: actions/download-artifact@v4
        with:
          name: release-Linux-x86_64

      - name: download Linux aarch64
        uses: actions/download-artifact@v4
        with:
          name: release-Linux-aarch64

      - name: download Linux armhf
        uses: actions/download-artifact@v4
        with:
          name: release-Linux-armhf
          
      - name: download Linux i686
        uses: actions/download-artifact@v4
        with:
          name: release-Linux-i686

      - name: download Windows x86_64
        uses: actions/download-artifact@v4
        with:
          name: release-Windows-x86_64

      - name: download Windows aarch64
        uses: actions/download-artifact@v4
        with:
          name: release-Windows-aarch64

      - name: download Windows i686
        uses: actions/download-artifact@v4
        with:
          name: release-Windows-i686

      - name: download macOS x86_64
        uses: actions/download-artifact@v4
        with:
          name: release-macOS-x86_64

      - name: download macOS aarch64
        uses: actions/download-artifact@v4
        with:
          name: release-macOS-aarch64

      - name: create zips
        run: |
          sudo apt-get install -y zip
          mkdir -p ./share/doc/assfonts
          cp LICENSE LICENSE.txt
          cp NEWS NEWS.txt
          cp NOTICE NOTICE.txt
          cp LICENSE NEWS NOTICE ./share/doc/assfonts/
          mkdir -p ./share/man/man1
          gzip -k ./doc/man/assfonts-cli.1
          cp ./doc/man/assfonts-cli.1.gz ./share/man/man1/
          mkdir bin
          cp -f assfonts-cli-${{ env.BUILD_NAME }}-x86_64-Linux ./bin/assfonts-cli
          cp -f assfonts-${{ env.BUILD_NAME }}-x86_64-Linux.AppImage assfonts.AppImage
          tar -czvf assfonts-${{ env.BUILD_NAME }}-x86_64-Linux.tar.gz bin/assfonts-cli assfonts.AppImage ./share/doc/assfonts/LICENSE ./share/doc/assfonts/NEWS ./share/doc/assfonts/NOTICE ./share/man/man1/assfonts-cli.1.gz
          rm -rf assfonts-cli-${{ env.BUILD_NAME }}-x86_64-Linux assfonts-${{ env.BUILD_NAME }}-x86_64-Linux.AppImage
          cp -f assfonts-cli-${{ env.BUILD_NAME }}-aarch64-Linux ./bin/assfonts-cli
          cp -f assfonts-${{ env.BUILD_NAME }}-aarch64-Linux.AppImage assfonts.AppImage
          tar -czvf assfonts-${{ env.BUILD_NAME }}-aarch64-Linux.tar.gz bin/assfonts-cli assfonts.AppImage ./share/doc/assfonts/LICENSE ./share/doc/assfonts/NEWS ./share/doc/assfonts/NOTICE ./share/man/man1/assfonts-cli.1.gz
          rm -rf assfonts-cli-${{ env.BUILD_NAME }}-aarch64-Linux assfonts-${{ env.BUILD_NAME }}-aarch64-Linux.AppImage
          cp -f assfonts-cli-${{ env.BUILD_NAME }}-armhf-Linux ./bin/assfonts-cli
          cp -f assfonts-${{ env.BUILD_NAME }}-armhf-Linux.AppImage assfonts.AppImage
          tar -czvf assfonts-${{ env.BUILD_NAME }}-armhf-Linux.tar.gz bin/assfonts-cli assfonts.AppImage ./share/doc/assfonts/LICENSE ./share/doc/assfonts/NEWS ./share/doc/assfonts/NOTICE ./share/man/man1/assfonts-cli.1.gz
          rm -rf assfonts-cli-${{ env.BUILD_NAME }}-armhf-Linux assfonts-${{ env.BUILD_NAME }}-armhf-Linux.AppImage
          cp -f assfonts-cli-${{ env.BUILD_NAME }}-i686-Linux ./bin/assfonts-cli
          cp -f assfonts-${{ env.BUILD_NAME }}-i686-Linux.AppImage assfonts.AppImage
          tar -czvf assfonts-${{ env.BUILD_NAME }}-i686-Linux.tar.gz bin/assfonts-cli assfonts.AppImage ./share/doc/assfonts/LICENSE ./share/doc/assfonts/NEWS ./share/doc/assfonts/NOTICE ./share/man/man1/assfonts-cli.1.gz
          rm -rf assfonts-cli-${{ env.BUILD_NAME }}-i686-Linux assfonts-${{ env.BUILD_NAME }}-i686-Linux.AppImage
          cp -f assfonts-cli-${{ env.BUILD_NAME }}-x86_64-Windows.exe assfonts-cli.exe
          cp -f assfonts-${{ env.BUILD_NAME }}-x86_64-Windows.exe assfonts.exe
          zip assfonts-${{ env.BUILD_NAME }}-x86_64-Windows.zip assfonts.exe assfonts-cli.exe LICENSE.txt NEWS.txt NOTICE.txt README.md
          rm -rf assfonts-cli-${{ env.BUILD_NAME }}-x86_64-Windows.exe assfonts-${{ env.BUILD_NAME }}-x86_64-Windows.exe
          cp -f assfonts-cli-${{ env.BUILD_NAME }}-aarch64-Windows.exe assfonts-cli.exe
          cp -f assfonts-${{ env.BUILD_NAME }}-aarch64-Windows.exe assfonts.exe
          zip assfonts-${{ env.BUILD_NAME }}-aarch64-Windows.zip assfonts.exe assfonts-cli.exe LICENSE.txt NEWS.txt NOTICE.txt README.md
          rm -rf assfonts-cli-${{ env.BUILD_NAME }}-aarch64-Windows.exe assfonts-${{ env.BUILD_NAME }}-aarch64-Windows.exe
          cp -f assfonts-cli-${{ env.BUILD_NAME }}-i686-Windows.exe assfonts-cli.exe
          cp -f assfonts-${{ env.BUILD_NAME }}-i686-Windows.exe assfonts.exe
          zip assfonts-${{ env.BUILD_NAME }}-i686-Windows.zip assfonts.exe assfonts-cli.exe LICENSE.txt NEWS.txt NOTICE.txt README.md
          rm -rf assfonts-cli-${{ env.BUILD_NAME }}-i686-Windows.exe assfonts-${{ env.BUILD_NAME }}-i686-Windows.exe

      - name: calculate hash
        run: |
          sha256sum assfonts-${{ env.BUILD_NAME }}-x86_64-Linux.tar.gz > assfonts-${{ env.BUILD_NAME }}-x86_64-Linux.tar.gz.sha256sum
          sha256sum assfonts-${{ env.BUILD_NAME }}-aarch64-Linux.tar.gz > assfonts-${{ env.BUILD_NAME }}-aarch64-Linux.tar.gz.sha256sum
          sha256sum assfonts-${{ env.BUILD_NAME }}-armhf-Linux.tar.gz > assfonts-${{ env.BUILD_NAME }}-armhf-Linux.tar.gz.sha256sum
          sha256sum assfonts-${{ env.BUILD_NAME }}-i686-Linux.tar.gz > assfonts-${{ env.BUILD_NAME }}-i686-Linux.tar.gz.sha256sum
          sha256sum assfonts-${{ env.BUILD_NAME }}-x86_64-Windows.zip > assfonts-${{ env.BUILD_NAME }}-x86_64-Windows.zip.sha256sum
          sha256sum assfonts-${{ env.BUILD_NAME }}-aarch64-Windows.zip > assfonts-${{ env.BUILD_NAME }}-aarch64-Windows.zip.sha256sum
          sha256sum assfonts-${{ env.BUILD_NAME }}-i686-Windows.zip > assfonts-${{ env.BUILD_NAME }}-i686-Windows.zip.sha256sum
          sha256sum assfonts-${{ env.BUILD_NAME }}-x86_64-macOS.dmg > assfonts-${{ env.BUILD_NAME }}-x86_64-macOS.dmg.sha256sum
          sha256sum assfonts-${{ env.BUILD_NAME }}-aarch64-macOS.dmg > assfonts-${{ env.BUILD_NAME }}-aarch64-macOS.dmg.sha256sum

      - name: edit release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: assfonts-*${{ env.BUILD_NAME }}-*
          tag: ${{ github.ref }}
          overwrite: false
          file_glob: true
          
